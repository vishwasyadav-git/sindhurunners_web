# =============================================================================
# Application
# =============================================================================
spring.application.name=sindhueventpay

# =============================================================================
# DataSource — values come from environment variables.
# For local dev, set these in your shell or a .env file loaded by Docker Compose.
# =============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://mysql-db:3306/sindhu_event_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:sindhu_user}
spring.datasource.password=${DATABASE_PASSWORD:yourpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / Hibernate
# ddl-auto=validate: Hibernate only validates schema matches entities.
# Flyway is the sole authority for schema changes.
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================================================
# Flyway — Database Migrations
# Scripts are in src/main/resources/db/migration/
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# =============================================================================
# File Upload Limits
# Aadhaar documents: max 5 MB per file, 10 MB total request
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# Razorpay — Payment Gateway
# NEVER hardcode these. Always supply via environment variables.
# =============================================================================
app.razorpay.key-id=${RAZORPAY_KEY_ID}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# =============================================================================
# AWS — S3 Storage for Aadhaar Documents
# In production: prefer IAM roles (leave access-key-id and secret-access-key blank).
# For local/dev: supply credentials via environment variables.
# =============================================================================
app.aws.region=${AWS_REGION:ap-south-1}
app.aws.s3-bucket=${AWS_S3_BUCKET}
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# =============================================================================
# CORS
# Comma-separated list of allowed origins.
# In production, set this to your exact frontend domain.
# =============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# =============================================================================
# File Upload Validation
# =============================================================================
app.upload.max-file-size-bytes=5242880
app.upload.allowed-mime-types=image/jpeg,image/png,application/pdf

# =============================================================================
# Actuator — Health & Info endpoints
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =============================================================================
# Logging
# Keep sensitive data OUT of logs.
# =============================================================================
logging.level.com.sindhueventpay=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
