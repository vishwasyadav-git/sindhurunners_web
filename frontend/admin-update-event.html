<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Event — Sindhu Runners</title>

    <!-- Tailwind CSS, Feather Icons, AOS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="icon" type="image/x-icon" href="/images/SindhuRunnerLogo02-04.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
        .category-row {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Navigation -->
    <nav class="bg-[#0A3D62] shadow-lg sticky top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <img src="images/SindhuRunnerLogo02-04.png" alt="Logo" class="h-10 w-10 mr-2 rounded-full">
                    <span class="text-xl font-bold text-white font-condensed tracking-wide">ADMIN PORTAL</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="admin-events.html" class="text-white hover:text-gray-300 font-medium text-sm flex items-center transition">
                        <i data-feather="grid" class="w-4 h-4 mr-1"></i> Dashboard
                    </a>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-full text-sm font-semibold transition flex items-center shadow-sm">
                        <i data-feather="log-out" class="w-4 h-4 mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 pb-20">
        
        <!-- Header -->
        <div class="flex items-center mb-8" data-aos="fade-down">
            <a href="admin-events.html" class="mr-4 text-gray-400 hover:text-indigo-600 transition p-2 bg-white rounded-full shadow-sm border border-gray-100">
                <i data-feather="arrow-left"></i>
            </a>
            <div>
                <h1 class="text-3xl font-bold text-gray-900 font-condensed tracking-wide">Update Event</h1>
                <p class="text-gray-500 mt-1">Modify event details and ticket categories.</p>
            </div>
        </div>

        <!-- Alerts -->
        <div id="globalAlert" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm items-center">
            <i data-feather="alert-circle" class="w-5 h-5 mr-2"></i><span id="globalAlertText"></span>
        </div>
        <div id="successAlert" class="hidden mb-6 bg-green-50 border-l-4 border-green-500 text-green-700 p-4 rounded shadow-sm items-center">
            <i data-feather="check-circle" class="w-5 h-5 mr-2"></i><span id="successAlertText"></span>
        </div>

        <form id="eventForm" class="space-y-8" data-aos="fade-up" data-aos-delay="100">
            
            <!-- Basic Details Card -->
            <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden">
                <div class="bg-gradient-to-r from-gray-50 to-white px-6 py-4 border-b border-gray-100">
                    <h2 class="font-condensed font-bold text-lg text-gray-800 flex items-center">
                        <i data-feather="file-text" class="w-5 h-5 mr-2 text-indigo-500"></i> Event Details
                    </h2>
                </div>
                
                <div class="p-6 md:p-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" for="eventCode">Event Code *</label>
                            <input type="text" id="eventCode" placeholder="e.g. SYC2026" required
                                class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-gray-50 font-mono text-gray-600">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" for="eventName">Event Name *</label>
                            <input type="text" id="eventName" placeholder="e.g. Sindhu Young Champions" required
                                class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" for="description">Description</label>
                        <textarea id="description" placeholder="Event description..." rows="3"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" for="eventDate">Event Date *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i data-feather="calendar" class="h-4 w-4 text-gray-400"></i>
                                </div>
                                <input type="date" id="eventDate" required
                                    class="pl-10 w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2" for="registrationClosesAt">Registration Closes At *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i data-feather="clock" class="h-4 w-4 text-gray-400"></i>
                                </div>
                                <input type="datetime-local" id="registrationClosesAt" required
                                    class="pl-10 w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="bg-indigo-50 rounded-lg p-4 border border-indigo-100 mt-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="isActive" class="h-5 w-5 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
                            <span class="ml-3 text-sm font-medium text-indigo-900">Event is Active (Visible & Open to public)</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Categories Card -->
            <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden">
                <div class="bg-gradient-to-r from-gray-50 to-white px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="font-condensed font-bold text-lg text-gray-800 flex items-center">
                        <i data-feather="users" class="w-5 h-5 mr-2 text-indigo-500"></i> Event Categories
                    </h2>
                    <button type="button" onclick="addCategoryRow()" class="bg-white hover:bg-gray-50 text-indigo-600 border border-indigo-200 font-semibold py-1.5 px-4 rounded-lg text-sm transition shadow-sm flex items-center">
                        <i data-feather="plus" class="w-4 h-4 mr-1"></i> Add Category
                    </button>
                </div>
                
                <div class="p-6 md:p-8 bg-gray-50 min-h-[150px]">
                    <div id="categoriesContainer" class="space-y-4">
                        <!-- Dynamic categories go here -->
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit" id="submitBtn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-10 rounded-full text-lg transition shadow-lg flex items-center">
                    <i data-feather="save" class="w-5 h-5 mr-2"></i> <span>Update Event</span>
                </button>
            </div>
        </form>
    </main>

    <script>
        feather.replace();
        AOS.init({ once: true });

        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '8080'
            ? 'http://localhost:8080/api/v1/admin'
            : '/api/v1/admin';

        const $ = id => document.getElementById(id);

        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'admin-login.html';
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id') || localStorage.getItem('editEventId');

        let categoryCount = 0;

        function showAlert(msg, isSuccess = false) {
            const errEl = $('globalAlert');
            const errText = $('globalAlertText');
            const succEl = $('successAlert');
            const succText = $('successAlertText');
            
            errEl.classList.add('hidden');
            errEl.classList.remove('flex');
            succEl.classList.add('hidden');
            succEl.classList.remove('flex');
            
            if (isSuccess) {
                succText.textContent = msg;
                succEl.classList.remove('hidden');
                succEl.classList.add('flex');
                setTimeout(() => { succEl.classList.add('hidden'); succEl.classList.remove('flex'); }, 5000);
            } else {
                errText.textContent = msg;
                errEl.classList.remove('hidden');
                errEl.classList.add('flex');
            }
            
            (isSuccess ? succEl : errEl).scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function addCategoryRow(cat = null) {
            const id = categoryCount++;
            const div = document.createElement('div');
            div.className = 'category-row bg-white p-5 rounded-xl shadow-sm border border-gray-200 relative group flex flex-col md:flex-row gap-4 items-end';
            div.id = `cat_row_${id}`;
            
            const catId = cat && cat.id ? cat.id : '';

            div.innerHTML = `
                <input type="hidden" class="cat-id" value="${catId}">
                <div class="w-full md:w-2/5">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Category Name</label>
                    <input type="text" class="cat-name w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white" placeholder="e.g. 5 KM" value="${cat ? cat.categoryName : ''}" required>
                </div>
                <div class="w-full md:w-1/5">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Min Age</label>
                    <input type="number" class="cat-min-age w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white" placeholder="0" value="${cat ? cat.minAge : ''}" required min="0">
                </div>
                <div class="w-full md:w-1/5">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Max Age</label>
                    <input type="number" class="cat-max-age w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white" placeholder="99" value="${cat ? cat.maxAge : ''}" required min="0">
                </div>
                <div class="w-full md:w-1/5 relative">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Fee (INR)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">₹</span>
                        </div>
                        <input type="number" step="0.01" class="cat-fee pl-7 w-full px-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-white font-mono" placeholder="0.00" value="${cat ? cat.fee : ''}" required min="0">
                    </div>
                </div>
                <button type="button" onclick="removeCategoryRow(${id})" class="absolute -top-3 -right-3 bg-red-100 hover:bg-red-500 text-red-600 hover:text-white p-1.5 rounded-full shadow transition md:static md:w-auto md:h-auto md:bg-transparent md:hover:bg-red-50 md:text-gray-400 md:hover:text-red-500 md:p-2 md:shadow-none" aria-label="Remove Category">
                    <i data-feather="trash-2" class="w-4 h-4"></i>
                </button>
            `;
            $('categoriesContainer').appendChild(div);
            feather.replace();
        }

        function removeCategoryRow(id) {
            const row = $(`cat_row_${id}`);
            if (row) {
                row.style.opacity = '0';
                row.style.transform = 'scale(0.95)';
                setTimeout(() => row.remove(), 200);
            }
        }

        async function loadEventData() {
            if (!eventId) {
                showAlert("No Event ID provided in URL.");
                $('submitBtn').disabled = true;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/events/${eventId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }

                const json = await res.json();
                
                if (!res.ok || !json.success) {
                    throw new Error(json.message || 'Failed to fetch event.');
                }

                const ev = json.data;
                $('eventCode').value = ev.eventCode;
                $('eventName').value = ev.eventName;
                $('description').value = ev.description || '';
                
                // Handle dates robustly (in case of array or string)
                if (ev.eventDate) {
                    let d = ev.eventDate;
                    if (Array.isArray(d)) {
                        $('eventDate').value = `${d[0]}-${String(d[1]).padStart(2, '0')}-${String(d[2]).padStart(2, '0')}`;
                    } else {
                        $('eventDate').value = String(d).slice(0, 10);
                    }
                }
                
                if (ev.registrationClosesAt) {
                    let dt = ev.registrationClosesAt;
                    if (Array.isArray(dt)) {
                        let hrs = dt.length > 3 ? dt[3] : 0;
                        let mins = dt.length > 4 ? dt[4] : 0;
                        $('registrationClosesAt').value = `${dt[0]}-${String(dt[1]).padStart(2, '0')}-${String(dt[2]).padStart(2, '0')}T${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
                    } else {
                        $('registrationClosesAt').value = String(dt).slice(0, 16);
                    }
                }

                $('isActive').checked = ev.active;

                if (ev.categories && ev.categories.length > 0) {
                    ev.categories.forEach(c => addCategoryRow(c));
                } else {
                    addCategoryRow(); // Fallback empty category
                }

            } catch (err) {
                showAlert(err.message);
            }
        }

        $('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!eventId) return;

            $('globalAlert').classList.add('hidden');
            $('globalAlert').classList.remove('flex');
            $('successAlert').classList.add('hidden');
            $('successAlert').classList.remove('flex');
            
            const btn = $('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="animate-spin w-5 h-5 mr-2"></i> <span>Updating...</span>';
            feather.replace();

            // Gather categories
            const categoryElements = document.querySelectorAll('.category-row');
            const categories = [];
            categoryElements.forEach(row => {
                const cId = row.querySelector('.cat-id').value;
                categories.push({
                    id: cId ? parseInt(cId) : null,
                    categoryName: row.querySelector('.cat-name').value.trim(),
                    minAge: parseInt(row.querySelector('.cat-min-age').value),
                    maxAge: parseInt(row.querySelector('.cat-max-age').value),
                    fee: parseFloat(row.querySelector('.cat-fee').value)
                });
            });

            if (categories.length === 0) {
                showAlert("Please add at least one category.");
                btn.disabled = false;
                btn.innerHTML = '<i data-feather="save" class="w-5 h-5 mr-2"></i> <span>Update Event</span>';
                feather.replace();
                return;
            }

            let regCloseStr = $('registrationClosesAt').value;
            if (regCloseStr.length === 16) regCloseStr += ":00";

            const payload = {
                id: parseInt(eventId),
                eventCode: $('eventCode').value.trim(),
                eventName: $('eventName').value.trim(),
                description: $('description').value.trim(),
                eventDate: $('eventDate').value,
                registrationClosesAt: regCloseStr,
                isActive: $('isActive').checked,
                categories: categories
            };

            try {
                const response = await fetch(`${API_BASE}/events/${eventId}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || data.error?.message || 'Failed to update event');
                }

                showAlert('Event updated successfully!', true);

            } catch (err) {
                showAlert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-feather="save" class="w-5 h-5 mr-2"></i> <span>Update Event</span>';
                feather.replace();
            }
        });

        // Init
        loadEventData();

    </script>
</body>
</html>
