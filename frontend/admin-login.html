<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Sindhu Runners</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary:       #1a6fc4;
            --primary-dark:  #134fa3;
            --danger:        #e74c3c;
            --text:          #1c2333;
            --text-muted:    #5a6478;
            --border:        #d4dce8;
            --bg-grad-start: #b8d9f0;
            --bg-grad-mid:   #aee6d8;
            --bg-grad-end:   #add8e6;
            --card-bg:       rgba(255,255,255,0.92);
            --radius:        16px;
            --radius-sm:     8px;
            --transition:    0.22s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, var(--bg-grad-start) 0%, var(--bg-grad-mid) 50%, var(--bg-grad-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 8px 40px rgba(26,111,196,0.13), 0 2px 10px rgba(0,0,0,0.07);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.6);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo-container h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .logo-container p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all var(--transition);
        }
        
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,111,196,0.12);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #1a8fc4 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 10px;
        }

        .btn-login:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26,111,196,0.35);
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .alert.visible {
            display: block;
        }
        
        .alert-error {
            background: #fdf0ee;
            border: 1px solid #f5c6c0;
            color: #922b21;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <h1>Sindhu Runners</h1>
            <p>Admin Login</p>
        </div>
        
        <div id="loginAlert" class="alert alert-error"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-input" required placeholder="admin@sindhurunners.com">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">Log In</button>
        </form>
        
        <a href="index.html" class="back-link">← Back to Main Site</a>
    </div>

    <script>
        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '8080'
            ? 'http://localhost:8080/api/v1'
            : '/api/v1';
            
        const $ = id => document.getElementById(id);
        
        // If already logged in, redirect
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'admin-events.html';
        }

        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = $('loginBtn');
            const alertEl = $('loginAlert');
            
            alertEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: $('email').value.trim(),
                        password: $('password').value
                    })
                });
                
                const data = await res.json();
                
                if (!res.ok || !data.success) {
                    throw new Error(data.message || 'Invalid credentials');
                }
                
                // Save token
                localStorage.setItem('adminToken', data.data.token);
                window.location.href = 'admin-events.html';
                
            } catch (err) {
                alertEl.textContent = err.message;
                alertEl.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
