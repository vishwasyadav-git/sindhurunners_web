<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Sindhu Runners</title>
    
    <!-- Tailwind CSS, Feather Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="icon" type="image/x-icon" href="/images/SindhuRunnerLogo02-04.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="flex w-full max-w-5xl bg-white shadow-2xl rounded-2xl overflow-hidden min-h-[600px] m-4">
        
        <!-- Left Side: Image (Hidden on mobile) -->
        <div class="hidden lg:block lg:w-1/2 relative bg-gray-900">
            <img src="images/cover_photo.jpg" alt="Sindhu Runners Marathon" class="absolute inset-0 w-full h-full object-cover opacity-80">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0A3D62] via-transparent to-transparent opacity-90"></div>
            <div class="absolute bottom-0 left-0 p-12 text-white">
                <h2 class="font-condensed text-4xl font-bold mb-2 tracking-wide uppercase">Admin Portal</h2>
                <p class="text-gray-200">Manage events, track registrations, and monitor community progress.</p>
            </div>
        </div>
        
        <!-- Right Side: Login Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 md:p-16">
            <div class="w-full max-w-sm">
                
                <div class="text-center mb-10">
                    <img src="images/SindhuRunnerLogo02-04.png" alt="Logo" class="h-16 w-16 mx-auto rounded-full mb-4 shadow-sm">
                    <h1 class="font-condensed text-3xl font-bold text-[#0A3D62] tracking-wide uppercase">Sindhu Runners</h1>
                    <p class="text-gray-500 mt-1 font-medium">Please sign in to continue</p>
                </div>
                
                <div id="loginAlert" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded text-sm flex items-center shadow-sm">
                    <i data-feather="alert-circle" class="w-5 h-5 mr-2"></i>
                    <span id="loginAlertText"></span>
                </div>
                
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="mail" class="h-5 w-5 text-gray-400"></i>
                            </div>
                            <input type="email" id="email" required placeholder="admin@sindhurunners.com"
                                class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-gray-50 focus:bg-white text-gray-900">
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="lock" class="h-5 w-5 text-gray-400"></i>
                            </div>
                            <input type="password" id="password" required placeholder="••••••••"
                                class="pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm bg-gray-50 focus:bg-white text-gray-900">
                        </div>
                    </div>
                    
                    <button type="submit" id="loginBtn" 
                        class="w-full bg-[#0A3D62] hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-full text-lg transition shadow-lg flex justify-center items-center mt-8">
                        Log In
                    </button>
                </form>
                
                <div class="mt-8 text-center border-t border-gray-100 pt-6">
                    <a href="index.html" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium inline-flex items-center transition">
                        <i data-feather="arrow-left" class="w-4 h-4 mr-1"></i> Back to Main Site
                    </a>
                </div>
                
            </div>
        </div>
        
    </div>

    <script>
        feather.replace();

        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '8080'
            ? 'http://localhost:8080/api/v1'
            : '/api/v1';
            
        const $ = id => document.getElementById(id);
        
        // If already logged in, redirect
        if (localStorage.getItem('adminToken')) {
            window.location.href = 'admin-events.html';
        }

        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = $('loginBtn');
            const alertEl = $('loginAlert');
            const alertText = $('loginAlertText');
            
            alertEl.classList.add('hidden');
            alertEl.classList.remove('flex');
            btn.disabled = true;
            btn.innerHTML = '<i data-feather="loader" class="animate-spin mr-2"></i> Logging in...';
            feather.replace();
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: $('email').value.trim(),
                        password: $('password').value
                    })
                });
                
                const data = await res.json();
                
                if (!res.ok || !data.success) {
                    throw new Error(data.message || 'Invalid credentials');
                }
                
                // Save token
                localStorage.setItem('adminToken', data.data.token);
                window.location.href = 'admin-events.html';
                
            } catch (err) {
                alertText.textContent = err.message;
                alertEl.classList.remove('hidden');
                alertEl.classList.add('flex');
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
