<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Sindhu Runners</title>

    <!-- Tailwind CSS, AOS, Feather Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="icon" type="image/x-icon" href="/images/SindhuRunnerLogo02-04.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Navigation -->
    <nav class="bg-[#0A3D62] shadow-lg sticky top-0 w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <img src="images/SindhuRunnerLogo02-04.png" alt="Logo" class="h-10 w-10 mr-2 rounded-full">
                    <span class="text-xl font-bold text-white font-condensed tracking-wide">ADMIN PORTAL</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="index.html" class="text-white hover:text-gray-300 font-medium text-sm flex items-center transition hidden sm:flex">
                        <i data-feather="home" class="w-4 h-4 mr-1"></i> Main Site
                    </a>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-full text-sm font-semibold transition flex items-center shadow-sm">
                        <i data-feather="log-out" class="w-4 h-4 mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8" data-aos="fade-down">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 font-condensed tracking-wide">Events Overview</h1>
                <p class="text-gray-500 mt-1">Manage all your upcoming and past events.</p>
            </div>
            <a href="admin-create-event.html" class="mt-4 sm:mt-0 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-full shadow-md hover:shadow-lg transition flex items-center">
                <i data-feather="plus" class="w-5 h-5 mr-1"></i> Create New Event
            </a>
        </div>

        <!-- Alerts -->
        <div id="globalAlert" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm items-center">
            <i data-feather="alert-circle" class="w-5 h-5 mr-2"></i><span id="globalAlertText"></span>
        </div>
        <div id="successAlert" class="hidden mb-6 bg-green-50 border-l-4 border-green-500 text-green-700 p-4 rounded shadow-sm items-center">
            <i data-feather="check-circle" class="w-5 h-5 mr-2"></i><span id="successAlertText"></span>
        </div>

        <!-- Events Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="eventsGrid" data-aos="fade-up" data-aos-delay="100">
            <div class="col-span-full py-20 text-center">
                <i data-feather="loader" class="animate-spin w-8 h-8 text-indigo-500 mx-auto mb-3"></i>
                <p class="text-gray-500">Loading events...</p>
            </div>
        </div>

    </main>

    <script>
        // Initialize icons & animations
        feather.replace();
        AOS.init({ once: true });

        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '8080'
            ? 'http://localhost:8080/api/v1/admin'
            : '/api/v1/admin';

        const $ = id => document.getElementById(id);

        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'admin-login.html';
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }

        function showAlert(msg, isSuccess = false) {
            const errEl = $('globalAlert');
            const errText = $('globalAlertText');
            const succEl = $('successAlert');
            const succText = $('successAlertText');
            
            errEl.classList.add('hidden');
            errEl.classList.remove('flex');
            succEl.classList.add('hidden');
            succEl.classList.remove('flex');
            
            if (isSuccess) {
                succText.textContent = msg;
                succEl.classList.remove('hidden');
                succEl.classList.add('flex');
                setTimeout(() => { succEl.classList.add('hidden'); succEl.classList.remove('flex'); }, 5000);
            } else {
                errText.textContent = msg;
                errEl.classList.remove('hidden');
                errEl.classList.add('flex');
                setTimeout(() => { errEl.classList.add('hidden'); errEl.classList.remove('flex'); }, 5000);
            }
        }

        async function loadEvents() {
            const grid = $('eventsGrid');
            try {
                const res = await fetch(`${API_BASE}/events`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }

                const json = await res.json();
                
                if (!res.ok || !json.success) {
                    throw new Error(json.message || 'Failed to load events.');
                }

                const events = json.data;
                if (events.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-20 text-center bg-white rounded-xl border border-gray-200 border-dashed">
                            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                                <i data-feather="calendar" class="w-8 h-8"></i>
                            </div>
                            <h3 class="text-lg font-bold text-gray-900 mb-1">No events found</h3>
                            <p class="text-gray-500 mb-4">Get started by creating your first event.</p>
                            <a href="admin-create-event.html" class="inline-flex items-center bg-indigo-50 text-indigo-700 font-semibold px-4 py-2 rounded-lg hover:bg-indigo-100 transition">
                                <i data-feather="plus" class="w-4 h-4 mr-1"></i> Create Event
                            </a>
                        </div>
                    `;
                    feather.replace();
                    return;
                }

                grid.innerHTML = '';
                events.forEach(ev => {
                    const isActive = ev.active;
                    const statusBg = isActive ? 'bg-green-100 text-green-800 border-green-200' : 'bg-red-50 text-red-700 border-red-200';
                    const statusText = isActive ? 'Active' : 'Disabled';
                    const statusIcon = isActive ? 'check-circle' : 'x-circle';
                    
                    const dateObj = new Date(ev.eventDate);
                    const formattedDate = dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

                    const closeObj = new Date(ev.registrationClosesAt);
                    const closeDate = closeObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-gray-100 overflow-hidden flex flex-col';
                    card.innerHTML = `
                        <div class="p-6 bg-gradient-to-br from-gray-50 to-white border-b border-gray-100 relative">
                            <span class="absolute top-4 right-4 inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold border ${statusBg}">
                                <i data-feather="${statusIcon}" class="w-3 h-3 mr-1"></i> ${statusText}
                            </span>
                            <div class="mt-4 mb-1">
                                <h3 class="font-condensed text-xl font-bold text-gray-900 leading-tight pr-20 truncate" title="${ev.eventName}">${ev.eventName}</h3>
                            </div>
                            <span class="inline-block bg-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded font-mono font-semibold tracking-wider">${ev.eventCode}</span>
                        </div>
                        
                        <div class="p-6 flex-grow">
                            <div class="space-y-3">
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-gray-500 font-medium flex items-center"><i data-feather="calendar" class="w-4 h-4 mr-2 text-indigo-400"></i> Event Date</span>
                                    <span class="font-semibold text-gray-900">${formattedDate}</span>
                                </div>
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-gray-500 font-medium flex items-center"><i data-feather="clock" class="w-4 h-4 mr-2 text-indigo-400"></i> Reg. Closes</span>
                                    <span class="font-semibold text-gray-900">${closeDate}</span>
                                </div>
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-gray-500 font-medium flex items-center"><i data-feather="users" class="w-4 h-4 mr-2 text-indigo-400"></i> Categories</span>
                                    <span class="font-semibold text-gray-900 inline-flex items-center justify-center bg-gray-100 rounded-full h-6 w-6">${ev.categories.length}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-4 border-t border-gray-100 grid grid-cols-3 gap-2">
                            <a href="admin-event-dashboard.html?id=${ev.id}" onclick="localStorage.setItem('dashboardEventId', '${ev.id}')" 
                                class="col-span-1 bg-white border border-gray-200 hover:border-indigo-300 hover:bg-indigo-50 text-indigo-700 rounded-lg py-2 flex flex-col items-center justify-center transition shadow-sm group">
                                <i data-feather="bar-chart-2" class="w-4 h-4 mb-1 group-hover:scale-110 transition-transform"></i>
                                <span class="text-[10px] font-bold uppercase tracking-wider">Stats</span>
                            </a>
                            <a href="admin-update-event.html?id=${ev.id}" onclick="localStorage.setItem('editEventId', '${ev.id}')" 
                                class="col-span-1 bg-white border border-gray-200 hover:border-blue-300 hover:bg-blue-50 text-blue-700 rounded-lg py-2 flex flex-col items-center justify-center transition shadow-sm group">
                                <i data-feather="edit-3" class="w-4 h-4 mb-1 group-hover:scale-110 transition-transform"></i>
                                <span class="text-[10px] font-bold uppercase tracking-wider">Edit</span>
                            </a>
                            <button onclick="disableEvent(${ev.id}, '${ev.eventName.replace(/'/g, "\\'")}')" ${!isActive ? 'disabled' : ''} 
                                class="col-span-1 bg-white border border-gray-200 ${isActive ? 'hover:border-red-300 hover:bg-red-50 text-red-600' : 'opacity-50 text-gray-400 cursor-not-allowed'} rounded-lg py-2 flex flex-col items-center justify-center transition shadow-sm group">
                                <i data-feather="${isActive ? 'slash' : 'lock'}" class="w-4 h-4 mb-1 ${isActive ? 'group-hover:scale-110 transition-transform' : ''}"></i>
                                <span class="text-[10px] font-bold uppercase tracking-wider">${isActive ? 'Disable' : 'Disabled'}</span>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                feather.replace();

            } catch (err) {
                grid.innerHTML = `
                    <div class="col-span-full py-10 bg-red-50 text-red-600 rounded-xl border border-red-200 text-center">
                        <i data-feather="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
                        <p class="font-semibold">Failed to load events</p>
                        <p class="text-sm mt-1">${err.message}</p>
                    </div>
                `;
                feather.replace();
            }
        }

        async function disableEvent(id, name) {
            if (!confirm(`Are you sure you want to disable "${name}"? Registrations will be closed.`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/events/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401 || res.status === 403) {
                    logout();
                    return;
                }

                const json = await res.json();
                
                if (!res.ok || !json.success) {
                    throw new Error(json.message || 'Failed to disable event.');
                }

                showAlert('Event disabled successfully.', true);
                loadEvents(); // refresh grid

            } catch(err) {
                showAlert(err.message);
            }
        }

        // Initialize
        loadEvents();

    </script>
</body>
</html>
