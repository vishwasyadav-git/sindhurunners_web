<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event — Sindhu Runners</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ─── Reset & Base ─────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:       #1a6fc4;
            --primary-dark:  #134fa3;
            --primary-light: #e8f1fc;
            --accent:        #e67e22;
            --success:       #27ae60;
            --danger:        #e74c3c;
            --text:          #1c2333;
            --text-muted:    #5a6478;
            --border:        #d4dce8;
            --bg-grad-start: #b8d9f0;
            --bg-grad-mid:   #aee6d8;
            --bg-grad-end:   #add8e6;
            --card-bg:       rgba(255,255,255,0.92);
            --card-shadow:   0 8px 40px rgba(26,111,196,0.13), 0 2px 10px rgba(0,0,0,0.07);
            --radius:        16px;
            --radius-sm:     8px;
            --transition:    0.22s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, var(--bg-grad-start) 0%, var(--bg-grad-mid) 50%, var(--bg-grad-end) 100%);
            min-height: 100vh;
            color: var(--text);
        }

        /* ─── Header ────────────────────────────────────────────────────────── */
        .site-header {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .title-block h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
        }
        .title-block p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition);
        }
        .back-link:hover { color: var(--primary-dark); }

        /* ─── Main Layout ───────────────────────────────────────────────────── */
        .page-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .page-title {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 36px;
        }

        /* ─── Card ──────────────────────────────────────────────────────────── */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1a8fc4 100%);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 {
            font-family: 'Roboto Condensed', sans-serif;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-body { padding: 24px; }

        /* ─── Form ──────────────────────────────────────────────────────────── */
        .form-group { margin-bottom: 20px; }

        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: #fff;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }
        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,111,196,0.12);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ─── Dynamic Categories ────────────────────────────────────────────── */
        .category-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 16px;
            padding: 16px;
            background: #f8fafd;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-row .form-group {
            margin-bottom: 0;
            flex: 1;
        }
        .category-row .form-group.small {
            flex: 0.6;
        }

        .btn-remove-row {
            background: #fdf0ee;
            color: var(--danger);
            border: 1px solid #f5c6c0;
            border-radius: var(--radius-sm);
            padding: 11px 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition);
        }
        .btn-remove-row:hover {
            background: #fadbd8;
        }

        .btn-add-row {
            background: #eaf9ef;
            color: #1e7e34;
            border: 1px solid #b2dfcc;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-add-row:hover {
            background: #d4edda;
        }

        /* ─── Submit button ─────────────────────────────────────────────────── */
        .btn-save {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, #1a8fc4 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-save:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26,111,196,0.35);
        }
        .btn-save:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* ─── Global alert ──────────────────────────────────────────────────── */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }
        .alert.visible { display: block; }
        .alert-error { background: #fdf0ee; border: 1px solid #f5c6c0; color: #922b21; }
        .alert-success { background: #eaf9ef; border: 1px solid #b2dfcc; color: #1e7e34; }

    </style>
</head>
<body>

    <header class="site-header">
        <div class="title-block">
            <h1>Sindhu Runners</h1>
            <p>Admin Dashboard</p>
        </div>
        <div style="display: flex; gap: 16px; align-items: center;">
            <a href="admin-events.html" class="back-link">← Back to Events</a>
            <a href="#" class="back-link" style="color: var(--danger);" onclick="logout()">Logout</a>
        </div>
    </header>

    <div class="page-wrapper">
        <h1 class="page-title">Create New Event</h1>
        <p class="page-subtitle">Add a new event to the registration system.</p>

        <div id="globalAlert" class="alert alert-error"></div>
        <div id="successAlert" class="alert alert-success"></div>

        <form id="eventForm">
            <!-- Basic Details -->
            <div class="card">
                <div class="card-header">
                    <h2>Event Details</h2>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="eventCode">Event Code *</label>
                            <input type="text" id="eventCode" class="form-input" placeholder="e.g. SYC2026" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="eventName">Event Name *</label>
                            <input type="text" id="eventName" class="form-input" placeholder="e.g. Sindhu Young Champions" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" class="form-input" placeholder="Event description..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="eventDate">Event Date *</label>
                            <input type="date" id="eventDate" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="registrationClosesAt">Registration Closes At *</label>
                            <input type="datetime-local" id="registrationClosesAt" class="form-input" required>
                        </div>
                    </div>

                    <div class="checkbox-group" style="margin-bottom:0;">
                        <input type="checkbox" id="isActive" checked>
                        <label for="isActive">Event is Active (Visible & Open)</label>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="card">
                <div class="card-header">
                    <h2>Event Categories</h2>
                    <button type="button" class="btn-add-row" onclick="addCategoryRow()">+ Add Category</button>
                </div>
                <div class="card-body" id="categoriesContainer">
                    <!-- Dynamic categories go here -->
                </div>
            </div>

            <button type="submit" class="btn-save" id="submitBtn">
                Save Event
            </button>
        </form>
    </div>

    <script>
        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '8080'
            ? 'http://localhost:8080/api/v1/admin'
            : '/api/v1/admin';

        const $ = id => document.getElementById(id);

        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'admin-login.html';
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }

        let categoryCount = 0;

        function showAlert(msg, isSuccess = false) {
            const el = isSuccess ? $('successAlert') : $('globalAlert');
            const other = isSuccess ? $('globalAlert') : $('successAlert');
            other.classList.remove('visible');
            el.textContent = msg;
            el.classList.add('visible');
            if (isSuccess) setTimeout(() => el.classList.remove('visible'), 5000);
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function addCategoryRow() {
            const id = categoryCount++;
            const div = document.createElement('div');
            div.className = 'category-row';
            div.id = `cat_row_${id}`;
            
            div.innerHTML = `
                <div class="form-group">
                    <label class="form-label">Category Name</label>
                    <input type="text" class="form-input cat-name" placeholder="e.g. 5 KM" required>
                </div>
                <div class="form-group small">
                    <label class="form-label">Min Age</label>
                    <input type="number" class="form-input cat-min-age" placeholder="0" required>
                </div>
                <div class="form-group small">
                    <label class="form-label">Max Age</label>
                    <input type="number" class="form-input cat-max-age" placeholder="99" required>
                </div>
                <div class="form-group small">
                    <label class="form-label">Fee (INR)</label>
                    <input type="number" step="0.01" class="form-input cat-fee" placeholder="0.00" required>
                </div>
                <button type="button" class="btn-remove-row" onclick="removeCategoryRow(${id})">X</button>
            `;
            $('categoriesContainer').appendChild(div);
        }

        function removeCategoryRow(id) {
            const row = $(`cat_row_${id}`);
            if (row) row.remove();
        }

        $('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            $('globalAlert').classList.remove('visible');
            $('successAlert').classList.remove('visible');
            const btn = $('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            // Gather categories
            const categoryElements = document.querySelectorAll('.category-row');
            const categories = [];
            categoryElements.forEach(row => {
                categories.push({
                    categoryName: row.querySelector('.cat-name').value.trim(),
                    minAge: parseInt(row.querySelector('.cat-min-age').value),
                    maxAge: parseInt(row.querySelector('.cat-max-age').value),
                    fee: parseFloat(row.querySelector('.cat-fee').value)
                });
            });

            if (categories.length === 0) {
                showAlert("Please add at least one category.");
                btn.disabled = false;
                btn.textContent = 'Save Event';
                return;
            }

            let regCloseStr = $('registrationClosesAt').value;
            if (regCloseStr.length === 16) regCloseStr += ":00";

            const payload = {
                eventCode: $('eventCode').value.trim(),
                eventName: $('eventName').value.trim(),
                description: $('description').value.trim(),
                eventDate: $('eventDate').value,
                registrationClosesAt: regCloseStr,
                isActive: $('isActive').checked,
                categories: categories
            };

            try {
                const response = await fetch(`${API_BASE}/events`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Failed to create event');
                }

                showAlert('Event created successfully!', true);
                setTimeout(() => { window.location.href = 'admin-events.html'; }, 1500);

            } catch (err) {
                showAlert(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Event';
            }
        });

        // Init with one blank category
        addCategoryRow();

    </script>
</body>
</html>
