<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event — Sindhu Runners</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ─── Reset & Base ─────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:       #1a6fc4;
            --primary-dark:  #134fa3;
            --primary-light: #e8f1fc;
            --accent:        #e67e22;
            --accent-dark:   #cf6d17;
            --success:       #27ae60;
            --danger:        #e74c3c;
            --warning:       #f39c12;
            --text:          #1c2333;
            --text-muted:    #5a6478;
            --border:        #d4dce8;
            --bg-grad-start: #b8d9f0;
            --bg-grad-mid:   #aee6d8;
            --bg-grad-end:   #add8e6;
            --card-bg:       rgba(255,255,255,0.92);
            --card-shadow:   0 8px 40px rgba(26,111,196,0.13), 0 2px 10px rgba(0,0,0,0.07);
            --radius:        16px;
            --radius-sm:     8px;
            --transition:    0.22s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, var(--bg-grad-start) 0%, var(--bg-grad-mid) 50%, var(--bg-grad-end) 100%);
            min-height: 100vh;
            color: var(--text);
        }

        /* ─── Header ────────────────────────────────────────────────────────── */
        .site-header {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .site-header img { height: 48px; }

        .site-header .title-block { flex: 1; }
        .site-header .title-block h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
        }
        .site-header .title-block p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color var(--transition);
        }
        .back-link:hover { color: var(--primary-dark); }

        /* ─── Main Layout ───────────────────────────────────────────────────── */
        .page-wrapper {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .page-title {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 36px;
        }

        /* ─── Card ──────────────────────────────────────────────────────────── */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1a8fc4 100%);
            padding: 20px 24px;
        }
        .card-header h2 {
            font-family: 'Roboto Condensed', sans-serif;
            color: #fff;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-body { padding: 24px; }

        /* ─── Form ──────────────────────────────────────────────────────────── */
        .form-group { margin-bottom: 20px; }

        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: #fff;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }
        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,111,196,0.12);
        }

        .form-error {
            color: var(--danger);
            font-size: 0.78rem;
            margin-top: 4px;
            display: none;
        }
        .form-error.visible { display: block; }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
        }

        /* ─── Submit button ─────────────────────────────────────────────────── */
        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, #1a8fc4 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-register:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26,111,196,0.35);
        }

        /* ─── Global alert ──────────────────────────────────────────────────── */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }
        .alert.visible { display: block; }
        .alert-error { background: #fdf0ee; border: 1px solid #f5c6c0; color: #922b21; }
        .alert-success { background: #eaf9ef; border: 1px solid #b2dfcc; color: #1e7e34; }

    </style>
</head>
<body>

    <header class="site-header">
        <div class="title-block">
            <h1>Sindhu Runners</h1>
            <p>Admin Dashboard</p>
        </div>
        <a href="index.html" class="back-link">
            ← Back to Home
        </a>
    </header>

    <div class="page-wrapper">
        <h1 class="page-title">Create New Event</h1>
        <p class="page-subtitle">Add a new event to the registration system.</p>

        <div id="globalAlert" class="alert alert-error"></div>
        <div id="successAlert" class="alert alert-success"></div>

        <div class="card">
            <div class="card-header">
                <h2>Event Details</h2>
            </div>
            <div class="card-body">
                <form id="createEventForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="eventCode">Event Code *</label>
                            <input type="text" id="eventCode" class="form-input" placeholder="e.g. EVT2026" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="eventName">Event Name *</label>
                            <input type="text" id="eventName" class="form-input" placeholder="e.g. Intercity Run 2026" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" class="form-input" placeholder="Event description..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="registrationFee">Registration Fee (INR) *</label>
                            <input type="number" id="registrationFee" class="form-input" min="0" step="0.01" value="0" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="maxRegistrations">Max Registrations *</label>
                            <input type="number" id="maxRegistrations" class="form-input" min="1" value="1000" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="startDate">Start Date</label>
                            <input type="date" id="startDate" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="endDate">End Date</label>
                            <input type="date" id="endDate" class="form-input">
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="registrationOpen" checked>
                        <label for="registrationOpen">Accept Registrations Immediately</label>
                    </div>

                    <button type="submit" class="btn-register" id="submitBtn">
                        <span class="btn-text">Create Event</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        function showAlert(msg, isSuccess = false) {
            const el = isSuccess ? $('successAlert') : $('globalAlert');
            const other = isSuccess ? $('globalAlert') : $('successAlert');
            
            other.classList.remove('visible');
            el.textContent = msg;
            el.classList.add('visible');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        $('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            $('globalAlert').classList.remove('visible');
            $('successAlert').classList.remove('visible');
            const btn = $('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const payload = {
                eventCode: $('eventCode').value.trim(),
                eventName: $('eventName').value.trim(),
                description: $('description').value.trim(),
                registrationFee: parseFloat($('registrationFee').value),
                maxRegistrations: parseInt($('maxRegistrations').value, 10),
                startDate: $('startDate').value || null,
                endDate: $('endDate').value || null,
                registrationOpen: $('registrationOpen').checked
            };

            try {
                // Determine API URL (handle both Live Server and proper backend)
                const apiUrl = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' 
                    ? 'http://localhost:8080/api/v1/events' 
                    : '/api/v1/events';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.details || data.error?.message || 'Failed to create event');
                }

                showAlert('Event created successfully! You can now register for it.', true);
                $('createEventForm').reset();
                
            } catch (err) {
                showAlert(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Event';
            }
        });
    </script>
</body>
</html>
