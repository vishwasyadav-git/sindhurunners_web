<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Dashboard — Sindhu Runners Admin</title>

    <!-- Tailwind CSS, Feather Icons, AOS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="icon" type="image/x-icon" href="/images/SindhuRunnerLogo02-04.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-condensed { font-family: 'Roboto Condensed', sans-serif; }
        
        /* Custom scrollbar for table */
        .table-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[1000] hidden items-center justify-center flex-col">
        <i data-feather="loader" class="animate-spin w-10 h-10 text-indigo-600 mb-4"></i>
        <p class="text-indigo-900 font-bold tracking-wider uppercase text-sm">Loading Data...</p>
    </div>

    <!-- Navigation -->
    <nav class="bg-[#0A3D62] shadow-lg sticky top-0 w-full z-50">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <img src="images/SindhuRunnerLogo02-04.png" alt="Logo" class="h-10 w-10 mr-2 rounded-full">
                    <span class="text-xl font-bold text-white font-condensed tracking-wide">ADMIN PORTAL</span>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="admin-events.html" class="text-white hover:text-gray-300 font-medium text-sm flex items-center transition">
                        <i data-feather="grid" class="w-4 h-4 mr-1"></i> Events
                    </a>
                    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-full text-sm font-semibold transition flex items-center shadow-sm">
                        <i data-feather="log-out" class="w-4 h-4 mr-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4" data-aos="fade-down">
            <div>
                <a href="admin-events.html" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 text-sm font-semibold mb-2 transition">
                    <i data-feather="arrow-left" class="w-4 h-4 mr-1"></i> Back to Events
                </a>
                <h1 id="eventTitle" class="text-3xl font-bold text-gray-900 font-condensed tracking-wide">Event Dashboard</h1>
                <p class="text-gray-500 mt-1">Real-time statistics and runner data</p>
            </div>
            <button id="downloadCsvBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md hover:shadow-lg transition flex items-center shrink-0">
                <i data-feather="download" class="w-5 h-5 mr-2"></i> Export CSV
            </button>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" data-aos="fade-up" data-aos-delay="100">
            <!-- Stat 1 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center relative overflow-hidden">
                <div class="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-indigo-50 to-transparent opacity-50"></div>
                <div class="w-14 h-14 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 mr-5 shrink-0">
                    <i data-feather="users" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Total Runners (Paid)</p>
                    <h3 id="statTotal" class="text-3xl font-condensed font-bold text-gray-900">0</h3>
                </div>
            </div>
            <!-- Stat 2 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center relative overflow-hidden">
                <div class="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-green-50 to-transparent opacity-50"></div>
                <div class="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center text-green-600 mr-5 shrink-0">
                    <i data-feather="dollar-sign" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Total Revenue</p>
                    <h3 id="statRevenue" class="text-3xl font-condensed font-bold text-gray-900">₹0</h3>
                </div>
            </div>
            <!-- Stat 3 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center relative overflow-hidden">
                <div class="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-purple-50 to-transparent opacity-50"></div>
                <div class="w-14 h-14 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 mr-5 shrink-0">
                    <i data-feather="pie-chart" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Gender (M/F)</p>
                    <h3 id="statGender" class="text-xl font-bold text-gray-900 mt-2">-</h3>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-8" data-aos="fade-up" data-aos-delay="200">
            <div class="flex flex-wrap items-end gap-5">
                <div class="flex-grow min-w-[200px]">
                    <label for="filterStatus" class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Status</label>
                    <div class="relative">
                        <select id="filterStatus" class="appearance-none w-full bg-gray-50 border border-gray-300 text-gray-700 py-2.5 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 transition shadow-sm font-medium">
                            <option value="">All Statuses</option>
                            <option value="PAID" selected>Success (Paid)</option>
                            <option value="PENDING_PAYMENT">Pending</option>
                            <option value="PAYMENT_FAILED">Failed</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                            <i data-feather="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
                
                <div class="flex-grow min-w-[150px]">
                    <label for="filterGender" class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Gender</label>
                    <div class="relative">
                        <select id="filterGender" class="appearance-none w-full bg-gray-50 border border-gray-300 text-gray-700 py-2.5 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 transition shadow-sm font-medium">
                            <option value="">All Genders</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                            <i data-feather="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <div class="flex-grow min-w-[200px]">
                    <label for="filterCategory" class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Category</label>
                    <div class="relative">
                        <select id="filterCategory" class="appearance-none w-full bg-gray-50 border border-gray-300 text-gray-700 py-2.5 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 transition shadow-sm font-medium">
                            <option value="">All Categories</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                            <i data-feather="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
                
                <div>
                    <button id="applyFiltersBtn" class="bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-600 hover:text-white font-bold py-2.5 px-6 rounded-lg transition shadow-sm h-full w-full whitespace-nowrap">
                        Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" data-aos="fade-up" data-aos-delay="300">
            <div class="overflow-x-auto table-scrollbar">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Bib / Reg No</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Name</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Category</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Gender</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Age</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Status</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">ID Document</th>
                        </tr>
                    </thead>
                    <tbody id="runnersTableBody" class="bg-white divide-y divide-gray-100">
                        <!-- Rows populated by JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                    <div>
                        <p class="text-sm text-gray-700" id="pageInfo">
                            Showing <span class="font-semibold">0</span> of <span class="font-semibold">0</span>
                        </p>
                    </div>
                    <div>
                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                            <button id="prevPageBtn" disabled class="relative inline-flex items-center px-4 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                                Previous
                            </button>
                            <button id="nextPageBtn" disabled class="relative inline-flex items-center px-4 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                                Next
                            </button>
                        </nav>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        feather.replace();
        AOS.init({ once: true });

        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '8080'
            ? 'http://localhost:8080/api/v1'
            : '/api/v1';

        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = 'admin-login.html';
        }

        // Get Event ID from URL params or localStorage fallback (for clean-url dev servers)
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id') || localStorage.getItem('dashboardEventId');

        function showToast(msg, isSuccess = false) {
            Toastify({
                text: msg,
                duration: 4000,
                gravity: "top",
                position: "right",
                style: {
                    background: isSuccess ? "#10B981" : "#EF4444",
                    borderRadius: "8px",
                    fontWeight: "500",
                    boxShadow: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)"
                }
            }).showToast();
        }

        if (!eventId) {
            showToast('No Event ID provided.');
            setTimeout(() => { window.location.href = 'admin-events.html'; }, 1500);
        }

        let currentPage = 0;
        const pageSize = 50;

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        });

        document.getElementById('applyFiltersBtn').addEventListener('click', () => {
            currentPage = 0;
            loadRegistrations();
        });

        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                loadRegistrations();
            }
        });

        document.getElementById('nextPageBtn').addEventListener('click', () => {
            currentPage++;
            loadRegistrations();
        });

        document.getElementById('downloadCsvBtn').addEventListener('click', () => {
            const status = document.getElementById('filterStatus').value;
            const gender = document.getElementById('filterGender').value;
            const categoryId = document.getElementById('filterCategory').value;
            
            let url = `${API_BASE}/admin/events/${eventId}/export?`;
            if (status) url += `status=${status}&`;
            if (gender) url += `gender=${gender}&`;
            if (categoryId) url += `categoryId=${categoryId}&`;

            // Trigger loading state visually for button
            const btn = document.getElementById('downloadCsvBtn');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i data-feather="loader" class="animate-spin w-5 h-5 mr-2"></i> Exporting...';
            feather.replace();
            btn.disabled = true;

            // We need to fetch it with auth header and trigger download
            fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if(!res.ok) throw new Error("Failed to export data");
                return res.blob();
            })
            .then(blob => {
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `registrations_event_${eventId}.csv`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
            })
            .catch(err => {
                showToast('Export failed: ' + err.message);
            })
            .finally(() => {
                btn.innerHTML = originalHtml;
                feather.replace();
                btn.disabled = false;
            });
        });

        async function fetchWithAuth(url, options = {}) {
            if (!options.headers) options.headers = {};
            options.headers['Authorization'] = `Bearer ${token}`;
            
            const res = await fetch(url, options);
            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('adminToken');
                window.location.href = 'admin-login.html';
            }
            return res;
        }

        async function loadDashboard() {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            
            try {
                // Load Event Details for Title and Categories
                const eventRes = await fetchWithAuth(`${API_BASE}/admin/events/${eventId}`);
                const eventData = await eventRes.json();
                if(eventData.success) {
                    document.getElementById('eventTitle').textContent = eventData.data.eventName + " Dashboard";
                    
                    const catSelect = document.getElementById('filterCategory');
                    if(eventData.data.categories) {
                        eventData.data.categories.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = c.id;
                            opt.textContent = c.categoryName;
                            catSelect.appendChild(opt);
                        });
                    }
                }

                // Load Stats
                const statsRes = await fetchWithAuth(`${API_BASE}/admin/events/${eventId}/stats`);
                const statsData = await statsRes.json();
                if(statsData.success) {
                    const d = statsData.data;
                    document.getElementById('statTotal').textContent = d.totalRegistrations;
                    document.getElementById('statRevenue').textContent = '₹' + d.totalRevenue.toLocaleString('en-IN');
                    
                    let genderStr = [];
                    if(d.genderBreakdown['MALE']) genderStr.push(`M: ${d.genderBreakdown['MALE']}`);
                    if(d.genderBreakdown['FEMALE']) genderStr.push(`F: ${d.genderBreakdown['FEMALE']}`);
                    document.getElementById('statGender').textContent = genderStr.join(' | ') || '-';
                }

                // Load Registrations
                await loadRegistrations();

            } catch (err) {
                console.error(err);
                showToast("Failed to load dashboard data");
            } finally {
                loading.classList.remove('flex');
                loading.classList.add('hidden');
            }
        }

        async function loadRegistrations() {
            const status = document.getElementById('filterStatus').value;
            const gender = document.getElementById('filterGender').value;
            const categoryId = document.getElementById('filterCategory').value;
            
            let url = `${API_BASE}/admin/events/${eventId}/registrations?page=${currentPage}&size=${pageSize}`;
            if (status) url += `&status=${status}`;
            if (gender) url += `&gender=${gender}`;
            if (categoryId) url += `&categoryId=${categoryId}`;

            try {
                const res = await fetchWithAuth(url);
                const data = await res.json();
                
                if (data.success) {
                    renderTable(data.data);
                }
            } catch (err) {
                console.error(err);
                showToast("Failed to load registrations: " + err.message);
            }
        }

        function renderTable(pageData) {
            const tbody = document.getElementById('runnersTableBody');
            tbody.innerHTML = '';

            if (pageData.content.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500 bg-gray-50">
                            <i data-feather="inbox" class="w-10 h-10 mx-auto text-gray-400 mb-3"></i>
                            <p class="font-medium text-lg text-gray-600">No registrations found</p>
                            <p class="text-sm">Try adjusting your filters to see more results.</p>
                        </td>
                    </tr>
                `;
                feather.replace();
            } else {
                pageData.content.forEach(r => {
                    let statusHtml = '';
                    if(r.status === 'PAID') {
                        statusHtml = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-800 border border-green-200">PAID</span>`;
                    } else if (r.status === 'PENDING_PAYMENT') {
                        statusHtml = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800 border border-yellow-200">PENDING</span>`;
                    } else {
                        statusHtml = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800 border border-red-200">${r.status}</span>`;
                    }
                    
                    let idBtn = '';
                    if (r.documentUrl) {
                        idBtn = `<a href="${r.documentUrl}" target="_blank" class="inline-flex items-center px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded transition"><i data-feather="file" class="w-3 h-3 mr-1"></i> View ID</a>`;
                    } else {
                        idBtn = `<span class="text-gray-400 text-xs font-medium italic">No ID provided</span>`;
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-indigo-600 font-mono">${r.registrationNumber || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${r.fullName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600"><span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs font-semibold">${r.categoryName}</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${r.gender}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 font-mono">${r.calculatedAge}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${statusHtml}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${idBtn}</td>
                    `;
                    tbody.appendChild(tr);
                });
                feather.replace();
            }

            // Update Pagination
            document.getElementById('pageInfo').innerHTML = `Showing page <span class="font-bold">${pageData.number + 1}</span> of <span class="font-bold">${pageData.totalPages || 1}</span> (Total: ${pageData.totalElements})`;
            
            document.getElementById('prevPageBtn').disabled = pageData.first;
            document.getElementById('nextPageBtn').disabled = pageData.last;
        }

        // Init
        loadDashboard();

    </script>
</body>
</html>
